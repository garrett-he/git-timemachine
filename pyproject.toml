[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling" ]

[project]
name = "git-timemachine"
version = "0.1.0"
description = "A command-line tool that helps you record commits on Git repositories at any time node."
readme = "README.md"
keywords = [ "committing", "git", "repository", "timemachine" ]
license = { text = "MIT" }
maintainers = [ { name = "Garrett HE", email = "garrett.he@outlook.com" } ]
authors = [ { name = "Garrett HE", email = "garrett.he@outlook.com" } ]
requires-python = ">=3.12,<3.15"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "prettytable>=3.18.0",
    "pydantic>=2.13.4",
    "pygit2>=1.19.3",
    "pyyaml>=6.0.3",
    "typer>=0.26.8",
]
optional-dependencies.dev = [
    "chance>=0.110",
    "pre-commit>=4.6.1",
    "pyproject-fmt>=2.25.3",
    "pyrefly>=1.1.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "rumdl>=0.2.41",
    "types-pyyaml>=6.0.12.20260724",
]
urls.Documentation = "https://github.com/garrett-he/git-timemachine/blob/main/README.md"
urls.Homepage = "https://github.com/garrett-he/git-timemachine"
urls.Issues = "https://github.com/garrett-he/git-timemachine/issues"
urls.Repository = "https://github.com/garrett-he/git-timemachine.git"
scripts.git-timemachine = "git_timemachine.cli:app"

[tool.hatch]
build.targets.wheel.packages = [ "src/git_timemachine" ]

[tool.ruff]
line-length = 120
indent-width = 4
format.indent-style = "space"
format.quote-style = "single"
format.line-ending = "lf"
lint.select = [ "A", "B", "C4", "D", "E", "F", "I", "N", "RUF", "SIM", "TCH", "UP", "W" ]
lint.pydocstyle.convention = "google"

[tool.pyproject-fmt]
indent = 4
keep_full_version = true
generate_python_version_classifiers = true
max_supported_python = "3.14"

[tool.pyrefly]
errors.implicit-abstract-class = "error"
errors.implicitly-defined-attribute = "error"
errors.missing-override-decorator = "error"
errors.unannotated-attribute = "error"
errors.unannotated-parameter = "error"
errors.unannotated-return = "error"
errors.untyped-import = "error"
preset = "strict"
project-includes = [ "src", "tests" ]

[tool.pytest]
ini_options.addopts = "-ra --strict-markers --strict-config --cov=git_timemachine --cov-report=term-missing"

[tool.coverage]
run.source = [ "git_timemachine" ]
report.fail_under = 80
report.show_missing = true

[tool.rumdl]
line-length = 120
disable = [
    "MD033",
    "MD034",
    "MD041",
]
MD004.style = "dash"
MD007.indent = 4
MD013.line_length = 120
MD013.strict = false
MD013.code_blocks = false
MD013.tables = false
MD024.allow_different_nesting = true
MD026.punctuation = ".,;:!"
